name: Import tested public source

on:
  push:
    branches: [feat/public-site-owner-login]
    paths: [.github/workflows/import-tested-public-source.yml]

permissions:
  contents: read

jobs:
  import:
    if: github.repository == 'lattelix/lifedeck' && github.ref == 'refs/heads/feat/public-site-owner-login'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download the exact tested source patch (public application code only)
        run: |
          curl --fail --silent --show-error --max-time 60 'https://sb-5yxxntsr1zzz.vercel.run/patch.txt' -o /tmp/lifedeck-public.patch
          echo 'dfa91034475125940471bb73b9dc0d5fe79b5277bc148a9bdf425a108d68c22d  /tmp/lifedeck-public.patch' | sha256sum --check --strict
          git apply --check /tmp/lifedeck-public.patch
          git apply /tmp/lifedeck-public.patch
      - name: Commit verified source to this feature branch without force
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: add tested public landing, legal pages and owner cookie login'
          git push origin HEAD:refs/heads/feat/public-site-owner-login
