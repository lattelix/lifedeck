name: Update activity board

on:
  workflow_dispatch:
  schedule:
    # Daily, off the top of the hour to avoid common GitHub Actions load spikes.
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-activity-board
  cancel-in-progress: false

jobs:
  update-board:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and validate board
        run: pnpm board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: pnpm lint

      - name: Build app
        run: pnpm build

      - name: Commit board update
        run: |
          if git diff --quiet -- public/board.json; then
            echo "public/board.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/board.json
          git commit -m "chore: update activity board"
          git push
